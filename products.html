<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Wheels & Suspension | CARLISM TH</title>

  <meta
    name="description"
    content="Wheels and suspension products from CARLISM TH."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- HEADER -->
  <header id="site-header"></header>


  <main>

    <!-- HERO -->
    <section class="product-page-hero">

      <div class="container">

        <!-- BACK + BREADCRUMB -->
        <div class="product-page-breadcrumb">

          <a
            href="javascript:history.back()"
            class="back-link"
          >
            <i class="fa-solid fa-arrow-left"></i>
            BACK
          </a>

          <span class="breadcrumb-divider">|</span>

          <a href="index.html">
            HOME
          </a>

          <span>/</span>

          <span>
            WHEELS & SUSPENSION
          </span>

        </div>


        <!-- HERO CONTENT -->
        <div class="product-hero-grid">

          <!-- TEXT -->
          <div class="product-hero-content">

            <p class="product-page-label">
              CARLISM TH
            </p>

            <h1>
              WHEELS &<br>
              SUSPENSION
            </h1>

            <p class="product-page-description">
              Upgrade your style, stance and driving experience
              with our selection of wheels and suspension parts.
            </p>

          </div>


          <!-- IMAGE -->
          <div class="product-hero-image">

            <img
              src="assets/products/wheels/hero/wheels-hero.jpg"
              alt="Wheels and suspension"
            >

          </div>

        </div>

      </div>

    </section>


    <!-- FILTER -->
    <section class="product-filter-section">

      <div class="container">

        <div class="product-filter-bar">

          <div class="product-filter-buttons">

            <button
              class="product-filter-btn active"
              data-filter="all"
              type="button"
            >
              ALL
            </button>

            <button
              class="product-filter-btn"
              data-filter="wheels"
              type="button"
            >
              WHEELS
            </button>

            <button
              class="product-filter-btn"
              data-filter="suspension"
              type="button"
            >
              SUSPENSION
            </button>

          </div>


          <div class="product-count">
            <span id="productCount">0</span>
            PRODUCTS
          </div>

        </div>

      </div>

    </section>


    <!-- PRODUCTS -->
    <section class="product-list-section">

      <div class="container">

        <div
          class="category-products-grid"
          id="productsGrid"
        ></div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer id="site-footer"></footer>


  <!-- FLOATING CHAT -->
  <div class="floating-chat">

    <a
      href="https://line.me/R/ti/p/@carlismth"
      class="floating-button"
      aria-label="LINE"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>LINE</span>
    </a>

    <a
      href="https://www.facebook.com/p/Carlism-TH-100092271006003/"
      class="floating-button"
      aria-label="Facebook Messenger"
      target="_blank"
      rel="noopener noreferrer"
    >
      <i class="fa-brands fa-facebook-messenger"></i>
    </a>

  </div>


  <script src="data/wheels.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>

</body>

</html>
