<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >


  <!-- SEO -->

  <title>
    Products | CARLISM TH
  </title>

  <meta
    id="seoDescription"
    name="description"
    content="Explore automotive parts, wheels, suspension, performance, exterior, interior, tuning and accessories from CARLISM TH."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    id="canonicalUrl"
    rel="canonical"
    href="https://tkb6667.github.io/carlism/products.html"
  >


  <!-- OPEN GRAPH -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="CARLISM TH"
  >

  <meta
    id="ogTitle"
    property="og:title"
    content="Products | CARLISM TH"
  >

  <meta
    id="ogDescription"
    property="og:description"
    content="Explore automotive parts and upgrades from CARLISM TH."
  >

  <meta
    id="ogUrl"
    property="og:url"
    content="https://tkb6667.github.io/carlism/products.html"
  >

  <meta
    id="ogImage"
    property="og:image"
    content="https://tkb6667.github.io/carlism/assets/images/hero/hero-mercedes.jpg.jpg"
  >


  <!-- CONNECTION -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >


  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ICON -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/components.css"
  >

  <link
    rel="stylesheet"
    href="css/products.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header id="site-header"></header>


  <!-- =========================================
       SHARED PRODUCT NAV
  ========================================== -->

  <div
    class="product-sticky-nav"
    id="productStickyNav"
  >

    <a
      href="javascript:history.back()"
      class="sticky-back-link"
    >
      <i class="fa-solid fa-arrow-left"></i>
      BACK
    </a>


    <span class="sticky-divider">
      |
    </span>


    <a
      href="index.html"
      class="sticky-home-link"
    >
      HOME
    </a>


    <span class="sticky-slash">
      /
    </span>


    <span
      class="sticky-current"
      id="stickyCategoryName"
    >
      PRODUCTS
    </span>


    <button
      class="sticky-mobile-menu-toggle"
      id="stickyMobileMenuToggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <i class="fa-solid fa-bars"></i>
    </button>


    <div
      class="sticky-mobile-menu-panel"
      id="stickyMobileMenu"
    ></div>

  </div>


  <!-- =========================================
       MAIN
  ========================================== -->

  <main>


    <!-- HERO -->

    <section class="product-page-hero">

      <div class="container">


        <!-- PC BREADCRUMB -->

        <div class="product-page-breadcrumb">

          <a
            href="javascript:history.back()"
            class="back-link"
          >
            <i class="fa-solid fa-arrow-left"></i>
            BACK
          </a>


          <span class="breadcrumb-divider">
            |
          </span>


          <a href="index.html">
            HOME
          </a>


          <span>
            /
          </span>


          <span id="breadcrumbCategory">
            PRODUCTS
          </span>

        </div>


        <!-- HERO CONTENT -->

        <div class="product-hero-grid">

          <div class="product-hero-content">

            <p class="product-page-label">
              CARLISM TH
            </p>


            <h1 id="categoryTitle">
              PRODUCTS
            </h1>


            <p
              class="product-page-description"
              id="categoryDescription"
            >
              Discover our automotive products.
            </p>

          </div>


          <div class="product-hero-image">

            <img
              id="categoryHeroImage"
              alt="CARLISM products"
            >

          </div>

        </div>

      </div>

    </section>


    <!-- =========================================
         FILTER
    ========================================== -->

    <section class="product-filter-section">

      <div class="container">

        <div class="product-filter-bar">


          <div
            class="product-filter-buttons"
            id="productFilterButtons"
          ></div>


          <div class="product-count">

            <span id="productCount">
              0
            </span>

            PRODUCTS

          </div>


        </div>

      </div>

    </section>


    <!-- =========================================
         PRODUCTS
    ========================================== -->

    <section class="product-list-section">

      <div class="container">

        <div
          class="category-products-grid"
          id="productsGrid"
        ></div>

      </div>

    </section>


  </main>


  <!-- =========================================
       NO JAVASCRIPT FALLBACK
  ========================================== -->

  <noscript>

    <section class="container">

      <h2>
        CARLISM TH Products
      </h2>

      <p>
        Browse our automotive product categories:
      </p>

      <nav
        aria-label="Product categories"
      >

        <a
          href="products.html?category=wheels-suspension"
        >
          Wheels & Suspension
        </a>

        <a
          href="products.html?category=performance"
        >
          Performance
        </a>

        <a
          href="products.html?category=exterior"
        >
          Exterior
        </a>

        <a
          href="products.html?category=interior"
        >
          Interior
        </a>

        <a
          href="products.html?category=tuning"
        >
          Tuning
        </a>

        <a
          href="products.html?category=accessories"
        >
          Accessories
        </a>

      </nav>

    </section>

  </noscript>


  <!-- FOOTER -->

  <footer id="site-footer"></footer>


  <!-- FLOATING CHAT -->

  <div class="floating-chat">

    <a
      href="https://line.me/R/ti/p/@carlismth"
      class="floating-button"
      aria-label="LINE"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span>LINE</span>
    </a>


    <a
      href="https://www.facebook.com/p/Carlism-TH-100092271006003/"
      class="floating-button"
      aria-label="Facebook Messenger"
      target="_blank"
      rel="noopener noreferrer"
    >
      <i class="fa-brands fa-facebook-messenger"></i>
    </a>

  </div>


  <!-- JS -->

  <script src="data/products.js"></script>

  <script src="js/components.js"></script>

  <script src="js/main.js"></script>

  <script src="js/product-nav.js"></script>

  <script src="js/products.js"></script>


</body>

</html>
