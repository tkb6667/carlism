<body>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header id="site-header"></header>


  <!-- =========================================
       SHARED PRODUCT NAV
  ========================================== -->

  <div
    class="product-sticky-nav"
    id="productStickyNav"
  >

    <a
      href="javascript:history.back()"

    >

    <span class="sticky-divider">

    </span>


    <a
      href="index.html"
      class="sticky-home-link"
    >

    </a>


    <span class="sticky-slash">
      /
    </span>


    <a
      href="products.html"
      class="sticky-current"
      id="detailCategoryLink"
    >
      PRODUCTS
    </a>


    <button
      class="sticky-mobile-menu-toggle"

    </button>

      id="stickyMobileMenu"

  <!-- =========================================
       PRODUCT DETAIL
  ========================================== -->

  <main class="detail-page">

    <div class="container">

      <section class="detail-grid">


        <!-- =====================================

        ====================================== -->

        <div class="detail-gallery">

          <button

            class="detail-main-image"
            id="detailMainButton"
            aria-label="Open gallery"
          >

            <img

              alt=""
            >

            <span class="detail-expand">
              <i class="fa-solid fa-expand"></i>
            </span>

          </button>


          <div
            class="detail-thumbnails"
            id="detailThumbnails"
          ></div>

        </div>


        <!-- =====================================
             PRODUCT INFO
        ====================================== -->

        <div class="detail-info">


          <div class="detail-meta">

            <span id="detailCategory">
              PRODUCT
            </span>

            <span id="detailBrand">
              CARLISM
            </span>

          </div>


          <h1 id="detailName">
            PRODUCT
          </h1>


          <p
            class="detail-subtitle"
            id="detailSubtitle"
          ></p>


          <div class="detail-separator"></div>


          <!-- PRICE -->

          <div class="detail-price-row">

            <span>
              PRICE
            </span>

            <strong id="detailPrice">
              CONTACT
            </strong>

          </div>


          <!-- SPECS -->

          <div class="detail-specs">


            <div class="detail-spec">

              <span>
                CATEGORY
              </span>

              <strong id="detailSpecCategory">

              </strong>

            </div>


            <div class="detail-spec">

              <span>
                BRAND
              </span>

              <strong id="detailSpecBrand">
                -
              </strong>

            </div>


            <div class="detail-spec">

              <span>
                FINISH
              </span>

              <strong id="detailSpecFinish">
                -
              </strong>

            </div>


          </div>


          <!-- CONTACT -->

          <div class="detail-actions">

            <a
              href="https://line.me/R/ti/p/@carlismth"
              class="detail-action detail-action-primary"
              target="_blank"
              rel="noopener noreferrer"
            >
              CHAT ON LINE

              <i class="fa-solid fa-arrow-right"></i>
            </a>


            <a
              href="https://www.facebook.com/p/Carlism-TH-100092271006003/"
              class="detail-action"
              target="_blank"
              rel="noopener noreferrer"
            >
              FACEBOOK

              <i class="fa-brands fa-facebook-messenger"></i>
            </a>

          </div>


          <p class="detail-note">
            Interested in this product?
            Contact CARLISM TH for product information,
            fitment and availability.
          </p>


        </div>


      </section>

    </div>

  </main>


  <!-- =========================================
       LIGHTBOX
  ========================================== -->

  <div
    class="detail-lightbox"
    id="detailLightbox"
    aria-hidden="true"
  >

      type="button"
      class="detail-lightbox-close"

    <button

      <img
        id="detailLightboxImage"

      </div>

    <button
      type="button"
      class="detail-lightbox-arrow detail-lightbox-next"

  <!-- =========================================
       NO JAVASCRIPT FALLBACK
  ========================================== -->

      <h2>

      </h2>

      <p>
        JavaScript is required to display this product.
        Browse our complete product collection below.
      </p>

      <a href="products.html">

      </a>

    </section>

  </noscript>


  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer id="site-footer"></footer>


  <!-- =========================================
       FLOATING CHAT
  ========================================== -->

  <div class="floating-chat">

    <a
      href="https://line.me/R/ti/p/@carlismth"
      class="floating-button"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LINE"
    >
      <span>LINE</span>
    </a>


    <a
      href="https://www.facebook.com/p/Carlism-TH-100092271006003/"
      class="floating-button"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook Messenger"

      <i class="fa-brands fa-facebook-messenger"></i>
    </a>

  </div>


  <!-- =========================================
       JS
  ========================================== -->

  <script src="data/products.js"></script>

  <script src="js/components.js"></script>

  <script src="js/main.js"></script>

  <script src="js/product-nav.js"></script>

  <script src="js/product-detail.js"></script>


  <!-- =========================================
       DYNAMIC SEO + PRODUCT SCHEMA
  ========================================== -->

  <script>
    (() => {

      const BASE_URL =
        "https://tkb6667.github.io/carlism/";


      /* =======================================
         FIND PRODUCT
      ======================================== */

      const params =
        new URLSearchParams(
          window.location.search
        );


      const id =
        Number(
          params.get("id")
        );


      const products =
        Array.isArray(window.products)
          ? window.products
          : [];


      const product =
        products.find(
          (item) =>
            Number(item.id) === id
        );


      if (!product) {
        return;
      }


      /* =======================================
         CATEGORY
      ======================================== */

      const categoryNames = {

        "wheels-suspension":
          "Wheels & Suspension",

        performance:
          "Performance",

        exterior:
          "Exterior",

        interior:
          "Interior",

        tuning:
          "Tuning",

        accessories:
          "Accessories"

      };


      const categoryName =
        categoryNames[product.category] ||
        "Products";


      /* =======================================
         SEO VALUES
      ======================================== */

      const subtitle =
        product.subtitle ||
        product.variant ||
        "";


      const seoTitle =
        `${product.name} | CARLISM TH`;


      const seoDescription =
        subtitle

          ? `${product.name} - ${subtitle}. Contact CARLISM TH for product information, fitment and availability.`

          : `${product.name}. Contact CARLISM TH for product information, fitment and availability.`;


      const canonical =
        `${BASE_URL}product-detail.html?id=${product.id}`;


      const categoryUrl =
        `${BASE_URL}products.html?category=${product.category}`;


      /* =======================================
         PRODUCT IMAGES
      ======================================== */

      const productImages =
        (
          Array.isArray(product.gallery) &&
          product.gallery.length

            ? product.gallery

            : [product.image]
        )
        .filter(Boolean)
        .map(
          (image) =>
            new URL(
              image,
              BASE_URL
            ).href
        );


      /* =======================================
         META
      ======================================== */

      document.title =
        seoTitle;


      document
        .querySelector("#seoDescription")
        ?.setAttribute(
          "content",
          seoDescription
        );


      document
        .querySelector("#canonicalUrl")
        ?.setAttribute(
          "href",
          canonical
        );


      /* =======================================
         OPEN GRAPH
      ======================================== */

      document
        .querySelector("#ogTitle")
        ?.setAttribute(
          "content",
          seoTitle
        );


      document
        .querySelector("#ogDescription")
        ?.setAttribute(
          "content",
          seoDescription
        );


      document
        .querySelector("#ogUrl")
        ?.setAttribute(
          "content",
          canonical
        );


      if (productImages.length) {

        document
          .querySelector("#ogImage")
          ?.setAttribute(
            "content",
            productImages[0]
          );

      }


      /* =======================================
         PRODUCT + BREADCRUMB JSON-LD
      ======================================== */

      const structuredData = {

        "@context":
          "https://schema.org",

        "@graph": [

          {
            "@type":
              "Product",

            "@id":
              `${canonical}#product`,

            "name":
              product.name,

            "description":
              seoDescription,

            "url":
              canonical,

            "image":
              productImages,

            "category":
              product.subcategoryLabel ||
              categoryName,

            "brand": {

              "@type":
                "Brand",

              "name":
                product.brand ||
                "CARLISM TH"

            }

          },


          {
            "@type":
              "BreadcrumbList",

            "@id":
              `${canonical}#breadcrumb`,

            "itemListElement": [

              {
                "@type":
                  "ListItem",

                "position":
                  1,

                "name":
                  "Home",

                "item":
                  BASE_URL
              },


              {
                "@type":
                  "ListItem",

                "position":
                  2,

                "name":
                  categoryName,

                "item":
                  categoryUrl
              },


              {
                "@type":
                  "ListItem",

                "position":
                  3,

                "name":
                  product.name,

                "item":
                  canonical
              }

            ]

          }

        ]

      };


      const schema =
        document.createElement(
          "script"
        );


      schema.id =
        "productStructuredData";


      schema.type =
        "application/ld+json";


      schema.textContent =
        JSON.stringify(
          structuredData
        );


      document.head.appendChild(
        schema
      );


    })();
  </script>


</body>

</html>
